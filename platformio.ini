; Two environments so the log level is chosen by which build you run, not by
; editing this file:
;
;   pio run                          release (default) -> .pio/build/esp32c3/
;   pio run -e esp32c3-debug         debug             -> .pio/build/esp32c3-debug/
;
; Log level is a size decision as much as a noise one. This firmware carries
; EasyWiFi (web server + captive portal) and the TLS stack that GitHub OTA
; needs, and the release build is the one that has to fit an OTA slot; the debug
; build is USB-only and is not size-gated. Run scripts/release.sh for the margin.
;
; The release build logs at INFO, not ERROR, which costs about 45 KB. That is
; deliberate: these lamps are mounted, have no console, and the log is served
; over HTTP at /api/log -- a buffer with only errors in it answers "is it
; broken" and never "what is it doing", which is the question that actually
; comes up. A lamp that is simply switched off looks exactly like a broken one
; from across a room, and INFO is what tells them apart.
;
; min_spiffs gives 1,966,080 bytes per OTA slot instead of the default 1,310,720.
; The default leaves almost no headroom once TLS is linked in, and a build that
; overflows the slot is an artifact no device can install -- it uploads fine over
; USB and then fails silently over the air.

[common]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    FastLED
    ; Parses REST request bodies and builds the status object. Hand-rolling the
    ; escaping for that was already a bug once -- error text from the TLS stack
    ; carries quotes.
    bblanchon/ArduinoJson
    ; Home Assistant talks to these lamps over MQTT; REST stays for everything
    ; else. See docs/home-assistant-control.md.
    knolleary/PubSubClient
    ; Pinned to the git tag, not the registry: v0.3.0 is released on GitHub but
    ; the PlatformIO registry still only carries 0.2.0. Switch back to
    ; brennanmke/EasyWiFi@^0.3.0 once it is published there.
    https://github.com/brennanMKE/EasyWiFi.git#v0.3.0

; Release: what ships and what installs over the air.
[env:esp32c3]
extends = common
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_LOG_MAXIMUM_LEVEL_INFO=y
    -DCONFIG_LOG_MAXIMUM_LEVEL=3

; Debug: full verbose logging, including EasyWiFi's scan results and the OTA
; progress lines. USB only.
[env:esp32c3-debug]
extends = common
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DCONFIG_LOG_MAXIMUM_LEVEL_VERBOSE=y
    -DCONFIG_LOG_MAXIMUM_LEVEL=5

[platformio]
default_envs = esp32c3
