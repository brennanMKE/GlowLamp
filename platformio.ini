; Two environments so the log level is chosen by which build you run, not by
; editing this file:
;
;   pio run                          release (default) -> .pio/build/esp32c3/
;   pio run -e esp32c3-debug         debug             -> .pio/build/esp32c3-debug/
;
; Log level is a size decision as much as a noise one. This firmware carries
; EasyWiFi (web server + captive portal) and the TLS stack that GitHub OTA
; needs, and verbose logging costs roughly 45 KB on top of that. The release
; build is the one that has to fit an OTA slot; the debug build is USB-only and
; is not size-gated. Run scripts/release.sh to check the margin.
;
; min_spiffs gives 1,966,080 bytes per OTA slot instead of the default 1,310,720.
; The default leaves almost no headroom once TLS is linked in, and a build that
; overflows the slot is an artifact no device can install -- it uploads fine over
; USB and then fails silently over the air.

[common]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    FastLED
    ; Pinned to the git tag, not the registry: v0.3.0 is released on GitHub but
    ; the PlatformIO registry still only carries 0.2.0. Switch back to
    ; brennanmke/EasyWiFi@^0.3.0 once it is published there.
    https://github.com/brennanMKE/EasyWiFi.git#v0.3.0

; Release: what ships and what installs over the air. ESP_LOGE survives at
; level 1, so genuine failures still reach the serial log.
[env:esp32c3]
extends = common
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_LOG_MAXIMUM_LEVEL_ERROR=y
    -DCONFIG_LOG_MAXIMUM_LEVEL=1

; Debug: full verbose logging, including EasyWiFi's scan results and the OTA
; progress lines. USB only.
[env:esp32c3-debug]
extends = common
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DCONFIG_LOG_MAXIMUM_LEVEL_VERBOSE=y
    -DCONFIG_LOG_MAXIMUM_LEVEL=5

[platformio]
default_envs = esp32c3
